services:
  postgres:
    image: postgres:16-alpine
    container_name: dotahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dotahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotahub_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dotahub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dotahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dotahub} -d $${POSTGRES_DB:-dotahub}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dotahub_pgdata:
    name: dotahub_pgdata